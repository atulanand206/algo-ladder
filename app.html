<script>
(function(){const b=document.getElementById('thm'),K='algo-ladder-theme',M=['auto','light','dark'],L={auto:'Auto',light:'Light',dark:'Dark'};
let m='auto';try{m=localStorage.getItem(K)||'auto'}catch(e){}if(!L[m])m='auto';

function topicCard(id){const {by,pm}=graphIndex(),n=by[id],kn=known(id),open=S.open===id,ideas=pm[id].filter(p=>by[p].col>=2),code=codeOf(id),np=PR.filter(p=>p.t===id).length;
 let h=`<div class="tc2 ${kn?'done':''} ${open?'open':''}"><div class="tch"><button class="tcb" data-topic="${id}" aria-expanded="${open}"><span class="tn">${esc(n.label)}</span><span class="td">${esc(n.d)}</span></button><button class="ob ${kn?'on':''}" data-known="${id}">${kn?'Known':'Mark known'}</button></div>`;
 if(open){h+=`<div class="tbody"><div class="lab" style="margin-top:0">Needs first</div><p>${ideas.length?ideas.map(p=>`<button class="jc" data-goto="${p}" style="--nb:var(--${by[p].cat}-bg);--nf:var(--${by[p].cat}-fg)">${esc(by[p].label)}</button>`).join(' '):'<span class="note">Nothing. A starting point.</span>'}</p>${lessonHTML(id)}${code.length?`<div class="lab" style="display:flex;justify-content:space-between;align-items:center;gap:8px">Code you write for it (${code.length})<button class="jc" data-pall="${id}">${code.every(pieceOpen)?'Collapse all':'Expand all'}</button></div><ul class="cl">${code.map(pieceHTML).join('')}</ul>`:''}${sectionsG(id)}${np?'':'<p class="note" style="margin-top:10px">No practice problems are attached to this topic yet.</p>'}</div>`}
 return h+`</div>`}
function levelHTML(n){const L=levelsDef(),l=L[n-1],[k,t]=lvProg(l);
 return `<div class="wrap rd"><button class="back" data-road="1">&larr; All levels</button><div class="top"><div><span class="ltag" style="background:var(--${l.cat}-bg);color:var(--${l.cat}-fg)">${esc(D.cats[l.cat])}</span> <span class="chip">${TBAND[l.tier]}</span><h1 style="margin-top:8px">Level ${l.n}: ${esc(l.name)}</h1><p class="sub">${t} topics. Read each one, write its code, try a problem, then mark it known.</p></div><div class="lnav">${n>1?`<button class="btn" data-lv="${n-1}">&larr; Level ${n-1}</button>`:''}${n<L.length?`<button class="btn" data-lv="${n+1}">Level ${n+1} &rarr;</button>`:''}</div></div><div class="card"><div class="meter" style="margin-bottom:6px"><b style="width:${k/t*100}%"></b></div><p class="note">${k} of ${t} known${k===t?' · level complete':''}</p>${k===t&&n<L.length?`<p style="margin-top:10px"><button class="btn pri big" data-lv="${n+1}">Next: Level ${n+1}, ${esc(L[n].name)}</button></p>`:''}</div><div class="tlist">${l.ids.map(topicCard).join('')}</div></div>`}

S.prog=loadLocal();
route();
(async()=>{try{const db=await (window.claude&&claude.use?claude.use('db'):null);if(!db)return;S.dbRef=db.collection('progress');S.live=true;
 S.dbRef.onSnapshot(s=>{const p={};s.docs.forEach(d=>{if(d.data().done)p[d.id]=true});S.prog=p;render()},()=>{S.live=false;render()})}catch(e){}})();
}
</script>
